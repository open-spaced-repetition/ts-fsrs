<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">DefaultScheduler state transitions</title>
  <desc id="description">Ratings move cards between New, Learning, Review, and Relearning.</desc>
  <style>
    :root { color-scheme: light dark; --canvas: #f8fafc; --surface: #fff; --text: #172033; --muted: #596579; --stroke: #8995aa; --arrow: #66738a; --note: #eef2ff; }
    @media (prefers-color-scheme: dark) { :root { --canvas: #101218; --surface: #1b1f2a; --text: #f2f4f8; --muted: #b5bdcc; --stroke: #68738a; --arrow: #a2acc0; --note: #252b3d; } }
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: var(--text); }
    .canvas { fill: var(--canvas); stroke: var(--stroke); stroke-width: 2; }
    .node { fill: var(--surface); stroke-width: 4; }
    .title { font-size: 28px; font-weight: 700; text-anchor: middle; }
    .subtitle { font-size: 16px; fill: var(--muted); text-anchor: middle; }
    .arrow { fill: none; stroke: var(--arrow); stroke-width: 3; marker-end: url(#arrowhead); }
    .label { font-size: 17px; font-weight: 650; text-anchor: middle; paint-order: stroke; stroke: var(--canvas); stroke-width: 8; stroke-linejoin: round; }
    .again { fill: #ef4444; } .hard { fill: #d97706; } .good { fill: #0284c7; } .easy { fill: #16a34a; }
    .note { fill: var(--note); stroke: var(--stroke); stroke-width: 1.5; }
  </style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="var(--arrow)" /></marker></defs>
  <rect class="canvas" x="1" y="1" width="1198" height="758" rx="24" />
  <text x="600" y="48" font-size="30" font-weight="750" text-anchor="middle">DefaultScheduler state transitions</text>
  <text x="600" y="76" class="subtitle">Default learning steps: 1m, 10m · relearning step: 10m</text>
  <path class="arrow" d="M290 198 H480" /><text class="label" x="385" y="178"><tspan class="again">Again</tspan><tspan> · </tspan><tspan class="hard">Hard</tspan><tspan> · </tspan><tspan class="good">Good*</tspan></text>
  <path class="arrow" d="M270 238 C470 300 700 370 900 393" /><text class="label easy" x="558" y="322">Easy</text>
  <path class="arrow" d="M690 224 C775 250 820 310 916 360" /><text class="label" x="786" y="270"><tspan class="good">Good*</tspan><tspan> · </tspan><tspan class="easy">Easy</tspan></text>
  <path class="arrow" d="M930 444 C850 500 775 560 690 568" /><text class="label again" x="806" y="515">Again*</text>
  <path class="arrow" d="M690 606 C800 600 850 505 930 456" /><text class="label" x="826" y="580"><tspan class="good">Good*</tspan><tspan> · </tspan><tspan class="easy">Easy</tspan></text>
  <path class="arrow" d="M520 150 C445 80 725 80 650 150" /><text class="label" x="585" y="112"><tspan class="again">Again</tspan><tspan> · </tspan><tspan class="hard">Hard</tspan><tspan> · </tspan><tspan class="good">Good*</tspan></text>
  <path class="arrow" d="M690 640 C755 725 455 725 520 640" /><text class="label" x="605" y="706"><tspan class="again">Again</tspan><tspan> · </tspan><tspan class="hard">Hard</tspan><tspan> · </tspan><tspan class="good">Good*</tspan></text>
  <path class="arrow" d="M1110 380 C1180 320 1180 485 1110 435" /><text class="label" x="1052" y="490"><tspan class="hard">Hard</tspan><tspan> · </tspan><tspan class="good">Good</tspan><tspan> · </tspan><tspan class="easy">Easy</tspan></text>
  <g><rect class="node" x="70" y="150" width="220" height="96" rx="48" stroke="#8b5cf6" /><text class="title" x="180" y="193">New</text><text class="subtitle" x="180" y="221">queue: new</text></g>
  <g><rect class="node" x="480" y="150" width="220" height="96" rx="48" stroke="#0ea5e9" /><text class="title" x="590" y="193">Learning</text><text class="subtitle" x="590" y="221">queue: learning</text></g>
  <g><rect class="node" x="900" y="360" width="220" height="96" rx="48" stroke="#16a34a" /><text class="title" x="1010" y="403">Review</text><text class="subtitle" x="1010" y="431">queue: review</text></g>
  <g><rect class="node" x="480" y="550" width="220" height="96" rx="48" stroke="#f97316" /><text class="title" x="590" y="593">Relearning</text><text class="subtitle" x="590" y="621">queue: learning</text></g>
  <g><rect class="note" x="72" y="562" width="330" height="92" rx="16" /><text x="94" y="592" font-size="17" font-weight="700">* Depends on short-term steps</text><text x="94" y="620" font-size="16" fill="var(--muted)">A positive step under one day stays in</text><text x="94" y="644" font-size="16" fill="var(--muted)">Learning/Relearning; otherwise → Review.</text></g>
</svg>
