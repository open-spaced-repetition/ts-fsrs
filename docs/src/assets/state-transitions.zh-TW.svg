<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">DefaultScheduler 狀態轉換</title><desc id="description">評分如何讓卡片在新卡、學習中、複習和重新學習之間轉換。</desc>
  <style>:root{color-scheme:light dark;--canvas:#f8fafc;--surface:#fff;--text:#172033;--muted:#596579;--stroke:#8995aa;--arrow:#66738a;--note:#eef2ff}@media(prefers-color-scheme:dark){:root{--canvas:#101218;--surface:#1b1f2a;--text:#f2f4f8;--muted:#b5bdcc;--stroke:#68738a;--arrow:#a2acc0;--note:#252b3d}}text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:var(--text)}.canvas{fill:var(--canvas);stroke:var(--stroke);stroke-width:2}.node{fill:var(--surface);stroke-width:4}.title{font-size:28px;font-weight:700;text-anchor:middle}.subtitle{font-size:16px;fill:var(--muted);text-anchor:middle}.arrow{fill:none;stroke:var(--arrow);stroke-width:3;marker-end:url(#arrowhead)}.label{font-size:17px;font-weight:650;text-anchor:middle;paint-order:stroke;stroke:var(--canvas);stroke-width:8;stroke-linejoin:round}.again{fill:#ef4444}.hard{fill:#d97706}.good{fill:#0284c7}.easy{fill:#16a34a}.note{fill:var(--note);stroke:var(--stroke);stroke-width:1.5}</style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="var(--arrow)" /></marker></defs><rect class="canvas" x="1" y="1" width="1198" height="758" rx="24" />
  <text x="600" y="48" font-size="30" font-weight="750" text-anchor="middle">DefaultScheduler 狀態轉換</text><text x="600" y="76" class="subtitle">預設學習步驟：1m、10m · 重新學習步驟：10m</text>
  <path class="arrow" d="M290 198 H480" /><text class="label" x="385" y="178" style="font-size: 16px"><tspan class="again">重來*</tspan><tspan> · </tspan><tspan class="hard">困難*</tspan><tspan> · </tspan><tspan class="good">良好*</tspan></text><path class="arrow" d="M270 238 C470 300 700 370 900 393" /><text class="label easy" x="558" y="322">簡單</text><path class="arrow" d="M690 224 C775 250 820 310 916 360" /><text class="label" x="786" y="270"><tspan class="good">良好*</tspan><tspan> · </tspan><tspan class="easy">簡單</tspan></text><path class="arrow" d="M930 444 C850 500 775 560 690 568" /><text class="label again" x="806" y="515">重來*</text><path class="arrow" d="M690 606 C800 600 850 505 930 456" /><text class="label" x="826" y="580"><tspan class="good">良好*</tspan><tspan> · </tspan><tspan class="easy">簡單</tspan></text><path class="arrow" d="M520 150 C445 80 725 80 650 150" /><text class="label" x="585" y="112"><tspan class="again">重來*</tspan><tspan> · </tspan><tspan class="hard">困難*</tspan><tspan> · </tspan><tspan class="good">良好*</tspan></text><path class="arrow" d="M690 640 C755 725 455 725 520 640" /><text class="label" x="605" y="706"><tspan class="again">重來*</tspan><tspan> · </tspan><tspan class="hard">困難*</tspan></text><path class="arrow" d="M1110 380 C1180 320 1180 485 1110 435" /><text class="label" x="1052" y="490"><tspan class="hard">困難</tspan><tspan> · </tspan><tspan class="good">良好</tspan><tspan> · </tspan><tspan class="easy">簡單</tspan></text>
  <g><rect class="node" x="70" y="150" width="220" height="96" rx="48" stroke="#8b5cf6" /><text class="title" x="180" y="193">新卡</text><text class="subtitle" x="180" y="221">佇列：new</text></g><g><rect class="node" x="480" y="150" width="220" height="96" rx="48" stroke="#0ea5e9" /><text class="title" x="590" y="193">學習中</text><text class="subtitle" x="590" y="221">佇列：learning</text></g><g><rect class="node" x="900" y="360" width="220" height="96" rx="48" stroke="#16a34a" /><text class="title" x="1010" y="403">複習</text><text class="subtitle" x="1010" y="431">佇列：review</text></g><g><rect class="node" x="480" y="550" width="220" height="96" rx="48" stroke="#f97316" /><text class="title" x="590" y="593">重新學習</text><text class="subtitle" x="590" y="621">佇列：learning</text></g><g><rect class="note" x="72" y="548" width="330" height="126" rx="16" /><text x="94" y="578" font-size="17" font-weight="700">* 取決於短期步驟</text><text x="94" y="606" font-size="16" fill="var(--muted)">0 &lt; 步驟時長 &lt; 1 天時保持在</text><text x="94" y="630" font-size="16" fill="var(--muted)">學習中/重新學習；</text><text x="94" y="654" font-size="16" fill="var(--muted)">否則進入複習。</text></g>
</svg>
