name: Preview Release

permissions:
  contents: read
  pull-requests: read

cache-mode: read

env:
  DEBUG: napi:*
  APP_NAME: optimizer
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

jobs:
  check:
    # First, trigger a permissions check on the user approving the pull request.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.result }}
      has-permissions: ${{ steps.checkPermissions.outputs.require-result }}
    steps:
      - name: Check permissions
        id: checkPermissions
        uses: actions-cool/check-user-permission@v2
        with:
          # In this example, the approver must have the write access
          # to the repository to trigger the package preview.
          require: 'write'
          username: ${{ github.event.review.user.login || github.actor }}

      - name: Verify approved commit
        id: verify
        if: github.event_name == 'workflow_dispatch' || steps.checkPermissions.outputs.require-result == 'true'
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            if (context.eventName === 'workflow_dispatch') return context.sha;
            const { pull_request: pr, review } = context.payload;
            if (review.state !== 'approved' || !review.commit_id || review.commit_id !== pr.head.sha) {
              throw new Error('Approval does not match the event PR head');
            }
            const { data: live } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pr.number,
            });
            if (live.state !== 'open' || live.head.sha !== review.commit_id) {
              throw new Error('PR head changed or PR is no longer open; a new approval is required');
            }
            return review.commit_id;

  build:
    needs:
      - check
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' && needs.check.outputs.has-permissions == 'true')
    uses: ./.github/workflows/build-napi.yml
    with:
      commit-sha: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.check.outputs.sha }}
  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - check
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.check.outputs.sha }}
          persist-credentials: false

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Run checks
        run: pnpm run check

      - name: Build Packages
        uses: ./.github/actions/build-packages
      - name: Cache test data
        id: cache-revlog
        uses: actions/cache@v6
        with:
          path: packages/binding-test/src/revlog.csv
          key: revlog-csv-v1

      - name: Download test data
        if: steps.cache-revlog.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p packages/binding-test/src
          curl -L https://github.com/open-spaced-repetition/fsrs-rs/files/15046782/revlog.csv -o packages/binding-test/src/revlog.csv

      - name: Run tests
        run: pnpm run test:coverage:ci

      - name: Revalidate approved commit before publishing
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            if (context.eventName === 'workflow_dispatch') return context.sha;
            const { pull_request: pr, review } = context.payload;
            if (review.state !== 'approved' || !review.commit_id || review.commit_id !== pr.head.sha) {
              throw new Error('Approval does not match the event PR head');
            }
            const { data: live } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pr.number,
            });
            if (live.state !== 'open' || live.head.sha !== review.commit_id) {
              throw new Error('PR head changed or PR is no longer open; a new approval is required');
            }
            return review.commit_id;

      - name: Publish Preview Packages
        run: |
          pnpm dlx pkg-pr-new@0.0.88 publish \
            './packages/fsrs' \
            './packages/srs-kit' \
            './packages/binding' \
            './packages/binding/npm/*' \
            --previewVersion \
            --compact \
            --packageManager=pnpm
