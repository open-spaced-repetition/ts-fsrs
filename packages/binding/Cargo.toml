[package]
authors = ["ishiko <ishiko732@gmail.com>"]
edition = "2024"
name = "fsrs-binding"
version = "0.0.2"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.2", default-features = true, features = [
  "napi5",
  "web_stream",
] }
napi-derive = "3.6.12"
csv = "1.4.0"
jiff = { version = "=0.2.38", default-features = false, features = [
  "alloc",
  "tzdb-bundle-always",
] }
serde = "1.0.229"
serde_json = "1.0.151"
itertools = "0.15.0"

[dependencies.fsrs]
git = "https://github.com/open-spaced-repetition/fsrs-rs"
rev = "c2da0f80d2fa97f3d5a663ecd50464c2bbcfb7a6"
default-features = false

[build-dependencies]
napi-build = "2.6.0"
