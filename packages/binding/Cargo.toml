[package]
authors = ["ishiko <ishiko732@gmail.com>"]
edition = "2024"
name = "fsrs-binding"
version = "0.0.2"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.12.7", default-features = true, features = [
  "napi5",
  "web_stream",
] }
napi-derive = "3.6.8"
csv = "1.4.0"
jiff = { version = "=0.2.37", default-features = false, features = [
  "alloc",
  "tzdb-bundle-always",
] }
serde = "1.0.229"
serde_json = "1.0.151"
itertools = "0.15.0"

[dependencies.fsrs]
git = "https://github.com/ishiko732/fsrs-rs"
branch = "wasm32-wasip1-progress-fsrs7"
default-features = false

[build-dependencies]
napi-build = "2.4.4"
